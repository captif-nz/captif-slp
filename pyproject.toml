[tool.poetry]
name = "captif-slp"
version = "0.21"
description = ""
authors = ["John Bull"]
homepage = "https://github.com/captif-nz/captif-slp"
license = "MIT"
readme = "README.md"
keywords = ["CAPTIF"]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "~2.1"
click = "^8.1.7"
pydantic = "^2"
scipy = "^1.7.1"
matplotlib = "^3.4.3"
psutil = "^5.8.0"
pyrsona = "^1.1"

[tool.poetry.dev-dependencies]
pytest = { version = "^9.0.3", python = ">=3.10,<4.0" }
pytest-cov = { version = "^7.1.0", python = ">=3.10,<4.0" }
pytest-randomly = { version = "^5.0.0", python = ">=3.10,<4.0" }
pre-commit = "^2.19.0"
line-profiler = "^4.1.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
